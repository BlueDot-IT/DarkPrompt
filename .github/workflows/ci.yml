name: ci

on:
  push:
  pull_request:

permissions: read-all

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v3.1.5

      - name: Install locked project
        run: uv sync --locked --extra dev

      - name: Static checks
        run: uv run --locked ruff check .

      - name: Test
        run: |
          set -o pipefail
          uv run --locked pytest -q --tb=short --cov=darkprompt --cov-report=term-missing 2>&1 | tee pytest.log

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.1
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v3.1.5

      - name: Install locked project
        run: uv sync --locked --extra dev

      - name: Build distributions
        run: uv run --locked pyproject-build

      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/*.whl
          test -f dist/*.tar.gz
